name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch supersedes the run still in progress, except on main:
# every merged commit gets a complete run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The required check. Besides the Linux tests it vets every release OS, cross-builds the
  # one target the release builds that no other step compiles, and tests the mobile module,
  # so that Windows or macOS breakage blocks a merge instead of surfacing at release time.
  test:
    name: fmt, vet and race tests
    # Pinned rather than ubuntu-latest: the AV1 tests depend on the distribution's encoders;
    # move it deliberately.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      # The integration tests drive FUSE mounts, an X display, the clipboard
      # and the AV1 encoder, so they need these tools on the runner.
      - name: Install integration test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3 xvfb xclip xsel ffmpeg

      # The AV1 tests depend on encoder behaviour that differs between
      # releases, so record what this runner has.
      - name: Encoder versions
        run: |
          ffmpeg -hide_banner -version | head -1
          dpkg -l | grep -i -E 'svtav1|libaom|librav1e' | awk '{print $2, $3}'
          lsb_release -ds

      - name: gofmt
        run: make fmt-check

      - name: go vet (linux, darwin, windows)
        run: make vet

      - name: Cross-compile windows/arm64
        run: make cross CROSS_TARGETS="windows/arm64"

      - name: go test -race
        run: make race

      # A separate Go module (gomobile bindings), outside ./... above.
      - name: Mobile module (vet and tests)
        run: make mobile-test

  # Known vulnerabilities reachable from our code, in dependencies and in the Go
  # toolchain itself (go.mod's `go` line selects it). A failure here usually means
  # a new Go patch release: raise the `go` line in go.mod and mobile/go.mod.
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      # Per OS: build tags decide which code (and which vulnerable symbols) is reachable.
      - name: govulncheck (main module and the mobile module; linux, windows, darwin)
        run: |
          set -eu
          go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          vc="$(go env GOPATH)/bin/govulncheck"
          for os in linux windows darwin; do
            echo "== GOOS=$os"
            GOOS=$os "$vc" ./...
            (cd mobile && GOOS=$os "$vc" ./...)
          done

  # The real binary across two Linux-kernel NATs in network namespaces: a
  # session only works if hole punching does. The lab checks after every
  # mode that the runner's own network (root namespace, systemd-resolved,
  # /etc/hosts) is untouched; bounded twice so that a lab that does break
  # the runner fails in minutes instead of losing it for an hour.
  natlab:
    name: NAT traversal end to end
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Install lab dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 iptables fuse3 curl python3

      - name: Run the NAT lab
        timeout-minutes: 25
        run: sudo env "PATH=$PATH" "HOME=$HOME" timeout 1200 test/natlab/natlab.sh all

  # The mesh's system setup on real macOS and Windows: interface, route and split DNS
  # set up, then undone, checking that nothing is left (TestSysDarwinE2E,
  # TestSysWindowsE2E). Hosted runners have root and Administrator; the tests are
  # skipped everywhere else. Not a required check.
  mesh-system:
    name: mesh system setup (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Build the test binary
        run: go test -c -o mesh.test${{ runner.os == 'Windows' && '.exe' || '' }} ./internal/mesh

      - name: macOS (as root)
        if: runner.os == 'macOS'
        run: sudo REMOHOP_NET_E2E=1 ./mesh.test -test.run 'SysDarwinE2E' -test.v -test.count=1

      # Wintun 0.14.1, checked against the hashes remohop itself pins
      # (internal/svc/vpn/wintun_locate.go).
      - name: Windows (Administrator, with Wintun)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'wintun.zip'
          Invoke-WebRequest -Uri 'https://www.wintun.net/builds/wintun-0.14.1.zip' -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne '07C256185D6EE3652E09FA55C0B673E2624B565E02C4B9091C79CA7D2F24EF51') { throw 'wintun zip hash mismatch' }
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
          $env:REMOHOP_WINTUN_DIR = Join-Path $env:RUNNER_TEMP 'wintun\bin\amd64'
          $env:REMOHOP_NET_E2E = '1'
          # Quoted: PowerShell would split -test.run at the dot.
          .\mesh.test.exe '-test.run=SysWindowsE2E' '-test.v' '-test.count=1'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  cross:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - linux/amd64
          - linux/arm64
          - darwin/amd64
          - darwin/arm64
          - windows/amd64
          - windows/arm64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Cross-compile ${{ matrix.target }}
        run: make cross CROSS_TARGETS="${{ matrix.target }}"

  # The committed website (site/public) must be what site/build.py makes of its sources.
  site:
    name: website is up to date
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Rebuild and compare
        run: |
          # The newest release tag, which site/build.py's LATEST_RELEASE (the
          # desktop app's version file) must name.
          REMOHOP_LATEST_TAG="$(git ls-remote --tags --refs origin 'v*' | sed 's#.*refs/tags/##' |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)"
          export REMOHOP_LATEST_TAG
          echo "newest release tag: ${REMOHOP_LATEST_TAG:-none}"
          python3 site/build.py
          git status --porcelain site/public
          git diff --exit-code --stat site/public ||
            { echo "::error::site/public is out of date: run python3 site/build.py and commit the result"; exit 1; }
          test -z "$(git status --porcelain site/public)" ||
            { echo "::error::site/build.py makes files that are not committed"; exit 1; }
