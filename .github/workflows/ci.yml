name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same ref supersedes the run still in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: fmt, vet and race tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      # The integration tests drive FUSE mounts, an X display, the clipboard
      # and the AV1 encoder, so they need these tools on the runner.
      - name: Install integration test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3 xvfb xclip xsel ffmpeg

      # The AV1 tests depend on encoder behaviour that differs between
      # releases, so record what this runner has.
      - name: Encoder versions
        run: |
          ffmpeg -hide_banner -version | head -1
          dpkg -l | grep -i -E 'svtav1|libaom|librav1e' | awk '{print $2, $3}'
          lsb_release -ds

      - name: gofmt
        run: make fmt-check

      - name: go vet
        run: make vet

      - name: go test -race
        run: make race

  # Known vulnerabilities reachable from our code, in dependencies and in the Go
  # toolchain itself (go.mod's `go` line selects it). A failure here usually means
  # a new Go patch release: raise the `go` line in go.mod and mobile/go.mod.
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: govulncheck (main module and the mobile module)
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
          cd mobile && go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

  # The real binary across two Linux-kernel NATs in network namespaces: a
  # session only works if hole punching does. The lab checks after every
  # mode that the runner's own network (root namespace, systemd-resolved,
  # /etc/hosts) is untouched; bounded twice so that a lab that does break
  # the runner fails in minutes instead of losing it for an hour.
  natlab:
    name: NAT traversal end to end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Install lab dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 iptables fuse3 curl python3

      - name: Run the NAT lab
        timeout-minutes: 25
        run: sudo env "PATH=$PATH" "HOME=$HOME" timeout 1200 test/natlab/natlab.sh all

  cross:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - linux/amd64
          - linux/arm64
          - darwin/amd64
          - darwin/arm64
          - windows/amd64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Cross-compile ${{ matrix.target }}
        run: make cross CROSS_TARGETS="${{ matrix.target }}"
