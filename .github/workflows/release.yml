name: Release

# Pushing a tag such as v1.2.3 builds, signs and publishes everything:
#
#   build    linux + windows archives (remohop and quick support), .deb/.rpm/.apk, SBOM
#            (scripts/build-release.sh)
#   macos    signed + notarized universal binary and RemoHop.app (stapled), made in the public CI repository
#            (readori/test-env-setup, sodesk-macos-release.yml: CI file names keep the pre-rename prefix) where the Apple secrets live,
#            then rebuilt here and compared byte for byte (scripts/verify-macos-release.sh)
#   publish  adds installers, SHA256SUMS, a keyless cosign signature, then the GitHub release
#   docker   multi-arch rendezvous-server image to ghcr.io, signed, with SBOM + provenance
#
# Cutting a release, secrets and signing: packaging/README.md. A manual run (workflow_dispatch)
# only builds and keeps the files as workflow artifacts; it never signs, releases or pushes.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp for a dry run, e.g. v0.0.0-test.1"
        required: true
        default: "v0.0.0-test.1"

# Nothing may write by default; each job below is granted only what it needs.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
  # The public CI repository that signs and notarizes the macOS binary (see the macos job).
  CI_REPO: readori/test-env-setup
  CI_WORKFLOW: sodesk-macos-release.yml
  # The Apple team of the Developer ID certificate that signs the macOS files. Public: it is in
  # every signature made with it. Changing it is a reviewed change to this file, on purpose.
  APPLE_TEAM_ID: H7FLAAL9RB

jobs:
  # The commit being released must pass the checks first: formatting, vet, the
  # unit tests and govulncheck (reachable vulnerabilities in the code and the Go
  # toolchain). Nothing is built, signed or published unless this job passes.
  verify:
    name: verify the tagged commit
    # Pinned rather than ubuntu-latest: the AV1 tests depend on the distribution's encoders.
    runs-on: ubuntu-24.04
    steps:
      # First, so that nothing at all runs for a malformed tag.
      - name: Check the tag
        run: |
          set -eu
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::$TAG is not a release tag like v1.2.3"; exit 1 ;;
          esac

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Releases are cut from main. This catches a tag put on the wrong commit (a branch, a
      # commit that never passed review); who may create tags is a repository setting.
      - name: The tagged commit is on main
        if: github.ref_type == 'tag'
        run: |
          set -eu
          git fetch --no-tags --filter=blob:none origin "+refs/heads/main:refs/remotes/origin/main"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
            { echo "::error::$GITHUB_SHA ($TAG) is not on main"; exit 1; }

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: gofmt and vet
        run: |
          set -eu
          go version
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "::error::gofmt"; exit 1; }
          for os in linux darwin windows; do CGO_ENABLED=0 GOOS=$os go vet ./...; done

      # The same tools the CI workflow installs for the integration tests.
      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fuse3 xvfb xclip xsel ffmpeg

      - name: Unit tests
        run: go test -count=1 ./...

      # The mobile library is its own module, so ./... above does not reach it.
      - name: Mobile module vet and tests
        working-directory: mobile
        run: |
          go vet ./...
          go test -count=1 ./...

      - name: govulncheck
        run: |
          set -eu
          go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
          (cd mobile && go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...)

  build:
    name: build linux and windows
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      # Same flags as every other build: see LDFLAGS in the Makefile.
      - name: Build
        run: VERSION="$TAG" scripts/build-release.sh build

      # HOOK(windows-signing): Windows binaries are not signed yet. scripts/sign-windows.sh does
      # nothing until the repository variable WINDOWS_SIGNING is set; see packaging/README.md
      # ("Windows signing") for the SignPath Foundation plan. The binaries are signed here, before
      # they are put into the zip files, so the signed files are the ones that get hashed.
      - name: Sign Windows binaries (hook)
        env:
          WINDOWS_SIGNING: ${{ vars.WINDOWS_SIGNING }}
        run: |
          scripts/sign-windows.sh dist/remohop-windows-amd64.exe dist/remohop-windows-arm64.exe \
            dist/quick/windows-amd64/RemoHop.exe dist/quick/windows-arm64/RemoHop.exe

      - name: Package (archives, .deb, .rpm, .apk, SBOM)
        run: VERSION="$TAG" OUT="$PWD/assets" scripts/build-release.sh package

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: assets-linux-windows
          path: assets/*
          if-no-files-found: error

  # The macOS binary is built, signed and notarized by the public CI repository, so that
  # the Apple certificate and App Store Connect key never live in this repository (they would
  # be exposed to everything that runs here once it is public). This job starts that workflow
  # for the commit being released (only after verify passed: nothing unverified gets an Apple
  # signature), waits for it, fetches the result, and then trusts none of it on the CI
  # repository's word: it rebuilds the binaries from the tagged commit and requires the signed
  # files to be exactly that code plus an Apple signature of APPLE_TEAM_ID
  # (scripts/verify-macos-release.sh). It needs one secret: CI_REPO_TOKEN, a fine-grained token
  # limited to readori/test-env-setup with "Actions: read and write" (see packaging/README.md).
  # Set the repository variable SKIP_MACOS=true to release without macOS (install.sh and
  # Homebrew then cannot work on macOS: only for tests).
  macos:
    name: macOS (sign + notarize in the CI repo)
    needs: verify
    if: github.ref_type == 'tag' && vars.SKIP_MACOS != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Start the signing workflow and wait for it
        env:
          GH_TOKEN: ${{ secrets.CI_REPO_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$GH_TOKEN" ] || { echo "::error::secret CI_REPO_TOKEN is not set (see packaging/README.md)"; exit 1; }
          corr="rel-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          me="$(gh api user --jq .login)"
          # The commit, not the tag name: it is exactly what the other jobs built. The API
          # returns the ID of the run it started (return_run_details); older API versions
          # return nothing, and the run is then found by the correlation string in its title.
          dispatch() {
            gh api -X POST "repos/$CI_REPO/actions/workflows/$CI_WORKFLOW/dispatches" \
              -f ref=main -f "inputs[ref]=$GITHUB_SHA" -f "inputs[version]=$TAG" -f "inputs[upload]=true" \
              -f "inputs[correlation]=$corr" "$@"
          }
          if ! resp="$(dispatch -F return_run_details=true 2>dispatch.err)"; then
            # Refused as an unknown key: nothing was started; dispatch the classic way.
            grep -q return_run_details dispatch.err || { cat dispatch.err; exit 1; }
            resp="$(dispatch)"
          fi
          id="$(printf '%s' "$resp" | jq -r '.workflow_run_id // empty' 2>/dev/null || true)"
          if [ -z "$id" ]; then
            for _ in $(seq 1 30); do
              sleep 10
              id="$(gh run list -R "$CI_REPO" --workflow "$CI_WORKFLOW" --event workflow_dispatch --limit 30 \
                --json databaseId,displayTitle \
                --jq "map(select(.displayTitle | endswith(\"[$corr]\"))) | .[0].databaseId // empty")"
              [ -z "$id" ] || break
            done
          fi
          [ -n "$id" ] || { echo "::error::the signing run did not appear in $CI_REPO"; exit 1; }
          # Whatever way it was found, it must be the run this job started: the release workflow
          # of the CI repository's main branch, dispatched by this token's account, for this commit.
          # A run ID returned by the dispatch can come back before GitHub renders the run's
          # run-name: its display_title is then just the workflow name for a few seconds. Wait
          # (up to 3 minutes) for the title to carry the correlation string before checking.
          for _ in $(seq 1 36); do
            gh api "repos/$CI_REPO/actions/runs/$id" >run.json
            jq -e --arg corr "[$corr]" '.display_title | endswith($corr)' run.json >/dev/null && break
            sleep 5
          done
          jq -e --arg wf ".github/workflows/$CI_WORKFLOW" --arg me "$me" --arg corr "[$corr]" --arg sha "$GITHUB_SHA" '
            .path == $wf and .event == "workflow_dispatch" and .head_branch == "main"
            and .triggering_actor.login == $me and (.display_title | endswith($corr))
            and (.display_title | contains($sha))' run.json >/dev/null ||
            { echo "::error::run $id in $CI_REPO is not the signing run this job started"; jq '{path, event, head_branch, display_title, triggering_actor: .triggering_actor.login}' run.json; exit 1; }
          echo "signing run: https://github.com/$CI_REPO/actions/runs/$id"
          echo "- macOS signing run: https://github.com/$CI_REPO/actions/runs/$id" >> "$GITHUB_STEP_SUMMARY"
          gh run watch "$id" -R "$CI_REPO" --exit-status --interval 30 >/dev/null ||
            { echo "::error::the macOS signing run failed: https://github.com/$CI_REPO/actions/runs/$id"; exit 1; }
          gh run download "$id" -R "$CI_REPO" -n remohop-macos-universal -D macos

      - name: Check the hand-off
        run: |
          set -eu
          cd macos
          sha256sum -c SHA256SUMS-macos
          grep -q ' RemoHop-macos.zip$' SHA256SUMS-macos || { echo "::error::the signing run returned no RemoHop-macos.zip (is the CI repo's workflow up to date?)"; exit 1; }
          grep -q ' RemoHop-macos.dmg$' SHA256SUMS-macos || { echo "::error::the signing run returned no RemoHop-macos.dmg (is the CI repo's workflow up to date?)"; exit 1; }

      # The files crossed repositories. Go builds are reproducible, so build the same binaries
      # and RemoHop.app here from the tagged commit and accept the signed ones only if they are
      # that code plus an Apple signature of APPLE_TEAM_ID (no entitlements, hardened runtime,
      # page hashes matching), and the disk image only if it holds exactly that app. The
      # certificate chain and notarization were checked by codesign, spctl and stapler in the
      # signing run, and Gatekeeper checks them again on every Mac.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: src

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: src/go.mod

      - name: Compare with a rebuild of the tagged commit
        run: |
          set -eu
          command -v 7z >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq 7zip; }
          VERSION="$TAG" TEAM_ID="$APPLE_TEAM_ID" src/scripts/verify-macos-release.sh "$PWD/macos"
          echo "- macOS files: the rebuilt code of $GITHUB_SHA, signed by team $APPLE_TEAM_ID" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-signed
          path: |
            macos/remohop
            macos/RemoHop-macos.zip
            macos/RemoHop-macos.dmg
          if-no-files-found: error

  publish:
    name: sign checksums and publish
    needs: [build, macos]
    # macos is skipped only through SKIP_MACOS; a failed macos job must stop the release.
    if: ${{ !cancelled() && github.ref_type == 'tag' && needs.build.result == 'success' && (needs.macos.result == 'success' || (needs.macos.result == 'skipped' && vars.SKIP_MACOS == 'true')) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # create the release
      id-token: write   # keyless signing: the OIDC token names this workflow and tag
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: assets-linux-windows
          path: assets

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.macos.result == 'success'
        with:
          name: macos-signed
          path: macos

      - name: Add the macOS archive and app, installers and SHA256SUMS
        env:
          # Only a deliberate SKIP_MACOS run may lack the macOS files.
          ALLOW_MISSING: ${{ vars.SKIP_MACOS == 'true' && 'remohop_darwin_universal.tar.gz RemoHop-macos.zip RemoHop-macos.dmg' || '' }}
        run: |
          set -eu
          if [ -f macos/remohop ]; then
            VERSION="$TAG" OUT="$PWD/assets" scripts/build-release.sh darwin macos/remohop
            VERSION="$TAG" OUT="$PWD/assets" scripts/build-release.sh darwin-app macos/RemoHop-macos.zip
            cp macos/RemoHop-macos.dmg assets/RemoHop-macos.dmg
          fi
          scripts/finalize-release.sh assets

      # Keyless signing: no private key exists anywhere. cosign asks GitHub for a short-lived OIDC
      # token, Sigstore's Fulcio issues a certificate that names this repository, workflow file
      # and tag, and the signature goes into the public Rekor log. Verifying needs only that
      # identity (install.sh does it). The bundle holds the signature, certificate and log proof.
      - name: Sign SHA256SUMS (cosign, keyless)
        run: |
          set -eu
          cosign="$(scripts/install-cosign.sh "$RUNNER_TEMP/bin")"
          "$cosign" sign-blob --yes --bundle assets/SHA256SUMS.sigstore.json assets/SHA256SUMS
          "$cosign" verify-blob --bundle assets/SHA256SUMS.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            assets/SHA256SUMS

      # Package-manager files for this release, for a human (or a later job) to submit. Stable
      # tags only: package managers should not track prereleases.
      - name: Render package-manager manifests
        if: ${{ !contains(github.ref_name, '-') }}
        run: scripts/gen-manifests.sh "$TAG" assets manifests

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !contains(github.ref_name, '-') }}
        with:
          name: package-manager-manifests
          path: manifests
          retention-days: 30

      # Created as a draft and published last, so nobody sees a release without its signature.
      # Re-running the job after a failed upload or edit continues with the draft it left
      # (files replaced with this run's, which were signed again above); a published release
      # is never touched.
      - name: Create the release
        working-directory: assets
        run: |
          set -eu
          ls -l
          flags=
          case "$TAG" in *-*) flags=--prerelease ;; esac
          if draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)"; then
            [ "$draft" = true ] || { echo "::error::release $TAG is already published"; exit 1; }
            echo "continuing with the existing draft of $TAG"
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber -- *
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
              --draft --title "$TAG" $flags -- *
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

  docker:
    name: rendezvous server image
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write   # push to ghcr.io
      id-token: write   # keyless signing of the image
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build, push and sign (linux/amd64 + linux/arm64)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/remohop-signal"
          tags=(-t "$image:$TAG")
          case "$TAG" in *-*) ;; *) tags+=(-t "$image:latest") ;; esac
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # The container driver is needed for multi-platform builds and attestations. No QEMU:
          # the Dockerfile cross-compiles with the Go toolchain.
          # Every image the build uses is pinned by digest (the Dockerfile's syntax and Go images,
          # and BuildKit here), so a moved Docker Hub tag cannot change what is built and signed.
          docker buildx create --name release --driver docker-container --use \
            --driver-opt image=moby/buildkit:v0.35.1@sha256:baf6138eb8c37644800c7c913fba051e840ebb9ba13eaf92d92ef9a1712d0b4c
          docker buildx build -f packaging/docker/Dockerfile --platform linux/amd64,linux/arm64 \
            --build-arg VERSION="$TAG" --provenance=mode=max --sbom=true \
            --metadata-file "$RUNNER_TEMP/meta.json" "${tags[@]}" --push .
          digest="$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/meta.json")"
          cosign="$(scripts/install-cosign.sh "$RUNNER_TEMP/bin")"
          "$cosign" sign --yes "$image@$digest"
          echo "- image: \`$image@$digest\`" >> "$GITHUB_STEP_SUMMARY"
